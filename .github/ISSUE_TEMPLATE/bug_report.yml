name: Bug / Erro
description: Report a reproducible problem / Relate um problema reproduzível
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps / Problema e passos
      description: Include expected and actual behavior. Never upload recordings or personal diagnostics.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows build, app version and Discord version / Versões
    validations:
      required: true
