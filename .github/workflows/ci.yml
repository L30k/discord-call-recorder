name: Build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore tests/Recorder.Tests --locked-mode --configfile NuGet.Config
      - name: Build
        run: dotnet build tests/Recorder.Tests -c Release --no-restore
      - name: Run regression tests (no audio capture)
        run: dotnet run --project tests/Recorder.Tests -c Release --no-build --no-restore
